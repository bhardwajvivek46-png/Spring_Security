version: '3.8'

services:
  Kafka:
    image: apache/kafka:latest
    container_name: Kafka
    ports:
      - "9092:9092"
#      host port: container port

    environment:
#      kafka unique identifier
      KAFKA_NODE_ID: 1
#      kafka Kraft node introduces 2 roles
      KAFKA_PROCESS_ROLES: broker,controller
#      kafka listen for connection on this: PLAINTEXT://9092
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://localhost:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTNER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - kafka-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - Kafka
    ports:
      - "7575:8080"
    environment:
      KAFKA_CLUSTER_0_NAME: local-kafka
      KAFKA_CLUSTER_0_BOOTSTRAPSERVERS: Kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - kafka-net

networks:
      kafka-net:

volumes:
      kafka-data: